<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ohana 動物溝通｜預約</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5EFF4;--card:#fff;--ink:#35243F;--muted:#6E5C78;--line:#E2D6E3;--accent:#B8416D;--ok:#4F7F6D;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:40px 20px 64px}
h1,h2{font-family:"Noto Serif TC",serif;line-height:1.3;margin:0 0 8px}
h1{font-size:30px}
h2{font-size:24px}
.lead{color:var(--muted);margin:0 0 28px}
fieldset{border:0;padding:0;margin:0 0 28px;min-width:0}
legend{font-weight:700;margin-bottom:10px;padding:0}
.dates{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer}
.tile b{display:block;font:700 28px/1.2 "Noto Serif TC",serif}
.tile small{color:var(--muted)}
.tile em{display:block;font-style:normal;font-size:13px;color:var(--ok);margin-top:4px}
.tile[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.tile[aria-pressed=true] small,.tile[aria-pressed=true] em{color:#E9DDEB}
.tile:disabled{opacity:.55;cursor:not-allowed}
.tile:disabled em{color:var(--muted)}
.opt{display:block;position:relative;margin-bottom:10px}
.opt input{position:absolute;opacity:0}
.opt>span{display:flex;justify-content:space-between;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.opt i{font-style:normal;color:var(--muted)}
.opt input:checked+span{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
input[type=text]{width:100%;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.hint{font-size:14px;color:var(--muted);margin:6px 0 0}
.go{display:block;width:100%;text-align:center;text-decoration:none;font:700 17px/1.4 inherit;font-family:inherit;color:#fff;background:var(--accent);border:0;border-radius:14px;padding:14px;cursor:pointer;margin-top:12px}
.go.alt{background:var(--ink)}
.go:disabled{opacity:.6;cursor:wait}
.opt input:focus-visible+span,.tile:focus-visible,.go:focus-visible,input[type=text]:focus-visible{outline:3px solid #8E6BB0;outline-offset:2px}
#err{color:#A32A2A;font-weight:500;margin:0 0 12px;min-height:1.7em}
.note{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;margin-top:8px}
#doneText{white-space:pre-line}
.go.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
#qrWrap{margin:16px 0}
#qr{display:inline-block;background:#fff;padding:12px;border:1.5px solid var(--line);border-radius:14px}
#qr img,#qr canvas{display:block;max-width:100%;height:auto}
pre{white-space:pre-wrap;word-break:break-all;user-select:all;-webkit-user-select:all;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;font:15px/1.8 inherit;font-family:inherit;margin:16px 0 0}
</style>
</head>
<body>
<main>
  <h1>Ohana 動物溝通</h1>
  <p class="lead">嗨～歡迎來找小豬搭起溝通橋樑，跟你的孩子聊聊天 🐷🤍<br>選好喜歡的日期與溝通方案，送出預約後，小豬就會先幫你保留時間囉！<br>期待和你們見面 ♡</p>

  <form id="f" novalidate>
    <fieldset>
      <legend>預約日期（晚上 8:30）</legend>
      <div class="dates" id="dates"><p class="hint">載入中…</p></div>
    </fieldset>

    <fieldset>
      <legend>方案</legend>
      <label class="opt"><input type="radio" name="plan" value="30"><span><b>30 分鐘</b><i>$1000</i></span></label>
      <label class="opt"><input type="radio" name="plan" value="60"><span><b>60 分鐘</b><i>$1800</i></span></label>
    </fieldset>

    <fieldset>
      <legend>溝通類型</legend>
      <label class="opt"><input type="radio" name="type" value="一般溝通"><span><b>一般溝通</b></span></label>
      <label class="opt"><input type="radio" name="type" value="離世溝通"><span><b>離世溝通</b></span></label>
    </fieldset>

    <fieldset>
      <legend><label for="name">你的 LINE 名稱</label></legend>
      <input type="text" id="name" maxlength="50" autocomplete="off">
      <p class="hint">請填寫與 LINE 顯示相同的名稱，方便小豬確認你的預約資料唷 ♡</p>
    </fieldset>

    <p id="err" role="alert"></p>
    <button class="go" id="send" type="submit">送出預約</button>
    <p class="note">目前不提供走失協尋、臨時急件服務。</p>
  </form>

  <section id="done" hidden>
    <h2>預約已送出</h2>
    <p id="doneText"></p>
    <div id="qrWrap" hidden><div id="qr"></div><p class="hint">用手機掃描，LINE 會開啟並帶入預約資料。</p></div>
    <pre id="msg"></pre>
    <button class="go" id="copy" type="button">複製訊息</button>
    <a class="go alt" id="line" target="_blank" rel="noopener">前往 LINE 官方帳號</a>
    <p class="hint" id="copyhint"></p>
    <button class="go ghost" id="again" type="button">預約下一個日期</button>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbz8Uruhxi96Br3d2EgbiGCdExKdWWieNZtFJbWyaIg29dSxFVJC31Ysalsz82Xm4KlQ/exec';
const LINE_URL = 'https://lin.ee/wM0FnDf';
const LINE_ID = '@160ujzhn'; // 填官方帳號的 Basic ID，例如 '@123abcde'；沒填就只會開啟官方帳號，不會帶入資料
const PLANS = {'30':'30分鐘 $1000','60':'60分鐘 $1800'};
const WD = ['日','一','二','三','四','五','六'];
const $ = s => document.querySelector(s);
let slots = [], picked = null, redirectTimer;

function parts(date){
  const [y,m,d] = date.split('-').map(Number);
  return {md: m + '/' + d, w: '週' + WD[new Date(y, m-1, d).getDay()]};
}

function renderDates(){
  const box = $('#dates');
  box.innerHTML = '';
  if(!slots.length){ box.innerHTML = '<p class="hint">目前沒有開放的日期。</p>'; return; }
  slots.forEach(s => {
    const p = parts(s.date), full = s.left < 1;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'tile'; b.disabled = full;
    b.setAttribute('aria-pressed', String(picked && picked.date === s.date));
    b.innerHTML = '<b>' + p.md + '</b><small>' + p.w + ' ' + s.time + '</small><em>' + (full ? '已額滿' : '可預約') + '</em>';
    b.onclick = () => { picked = s; renderDates(); };
    box.appendChild(b);
  });
}

async function load(){
  try{
    const r = await fetch(API_URL + '?t=' + Date.now(), {cache: 'no-store'});
    const j = await r.json();
    slots = j.slots || [];
    if(picked && !slots.some(s => s.date === picked.date && s.left > 0)) picked = null;
    renderDates();
  }catch(e){
    $('#dates').innerHTML = '<p class="hint">日期載入失敗，請重新整理頁面。</p>';
  }
}

$('#f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const err = $('#err'); err.textContent = '';
  const plan = (document.querySelector('input[name=plan]:checked') || {}).value;
  const type = (document.querySelector('input[name=type]:checked') || {}).value;
  const name = $('#name').value.trim();
  if(!picked) return err.textContent = '請選擇預約日期';
  if(!plan) return err.textContent = '請選擇方案';
  if(!type) return err.textContent = '請選擇溝通類型';
  if(!name) return err.textContent = '請填寫 LINE 名稱';

  const btn = $('#send'); btn.disabled = true; btn.textContent = '送出中…';
  try{
    const r = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({name, plan, type, date: picked.date, time: picked.time})
    });
    const j = await r.json();
    if(!j.ok){
      err.textContent = j.error || '送出失敗，請再試一次';
      if(j.slots){ slots = j.slots; picked = null; renderDates(); }
      return;
    }
    const p = parts(picked.date);
    $('#msg').textContent =
      '【預約確認】\n' +
      'LINE名稱：' + name + '\n' +
      '預約日期：' + p.md + '（' + p.w + '）' + picked.time + '\n' +
      '方案：' + PLANS[plan] + '\n' +
      '溝通類型：' + type + '\n' +
      '預約編號：' + j.id;
    const msgText = $('#msg').textContent;
    // 帶入訊息的連結只在手機上可靠；電腦版改成「複製訊息＋開啟官方帳號」
    const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    const useAuto = LINE_ID && mobile;
    const oaLink = LINE_ID
      ? 'https://line.me/R/oaMessage/' + encodeURIComponent(LINE_ID).replace('%40', '@') + '/?' + encodeURIComponent(msgText)
      : LINE_URL;
    const link = useAuto ? oaLink : LINE_URL;
    $('#line').href = link;
    $('#line').textContent = useAuto ? '前往 LINE，帶入預約資料' : '前往 LINE 官方帳號';
    $('#doneText').textContent = useAuto
      ? '這個日期已為你保留。接下來會自動開啟 LINE，請在 LINE 裡按「傳送」，官方帳號會回覆付款方式。如果沒有自動跳轉，請按下面的按鈕；或複製訊息後到官方帳號貼上送出。'
      : '你的預約時段已經幫你保留好囉！🐷🤍\n請用手機掃描下方 QR Code，LINE 就會自動帶入預約資料，只要按下「傳送」就可以囉！\n小豬收到訊息並確認後，會再回覆你付款方式 ♡\n也可以點選「複製訊息」，到 LINE 官方帳號貼上傳送，一樣可以完成確認唷！';
    // 電腦版：顯示 QR Code，用手機掃描後開啟 LINE 並帶入訊息
    if (!mobile && LINE_ID && window.QRCode) {
      $('#qr').innerHTML = '';
      new QRCode($('#qr'), {text: oaLink, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.L});
      $('#qrWrap').hidden = false;
    }
    $('#f').hidden = true; $('#done').hidden = false;
    window.scrollTo(0, 0);
    if (useAuto) redirectTimer = setTimeout(() => { location.href = link; }, 800);
  }catch(e){
    err.textContent = '連線失敗，請檢查網路後再試一次';
  }finally{
    btn.disabled = false; btn.textContent = '送出預約';
  }
});

$('#copy').onclick = async () => {
  const text = $('#msg').textContent;
  try{
    await navigator.clipboard.writeText(text);
    $('#copyhint').textContent = '已複製，請到 LINE 貼上送出。';
  }catch(e){
    const r = document.createRange(); r.selectNodeContents($('#msg'));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    $('#copyhint').textContent = '無法自動複製，訊息已選取，請長按後選「拷貝」。';
  }
};

$('#again').onclick = () => {
  clearTimeout(redirectTimer);
  $('#done').hidden = true; $('#f').hidden = false;
  $('#qrWrap').hidden = true; $('#qr').innerHTML = ''; $('#copyhint').textContent = '';
  document.querySelectorAll('input[type=radio]').forEach(i => { i.checked = false; });
  picked = null; $('#err').textContent = '';
  load(); // 重新讀取名額，剛預約的日期會顯示已額滿
  window.scrollTo(0, 0);
};

load();
</script>
</body>
</html>
