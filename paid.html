<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>付款完成通知｜小豬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5EFF4;--card:#fff;--ink:#35243F;--muted:#6E5C78;--line:#E2D6E3;--accent:#B8416D;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:40px 20px 64px}
h1{font:700 30px/1.3 "Noto Serif TC",serif;margin:0 0 8px}
.lead{color:var(--muted);margin:0 0 24px;white-space:pre-line}
.go{display:block;width:100%;text-align:center;text-decoration:none;font:700 17px/1.4 "Noto Sans TC",sans-serif;color:#fff;background:var(--accent);border:0;border-radius:14px;padding:14px;cursor:pointer;margin-top:12px}
.go.alt{background:var(--ink)}
.go:focus-visible{outline:3px solid #8E6BB0;outline-offset:2px}
#qrWrap{margin:20px 0}
#qr{display:inline-block;background:#fff;padding:12px;border:1.5px solid var(--line);border-radius:14px}
#qr img,#qr canvas{display:block;max-width:100%;height:auto}
.hint{font-size:14px;color:var(--muted);margin:6px 0 0}
pre{white-space:pre-wrap;user-select:all;-webkit-user-select:all;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;font:15px/1.8 "Noto Sans TC",sans-serif;margin:16px 0 0}
</style>
</head>
<body>
<main>
  <h1>付款完成囉 🐷🤍</h1>
  <p class="lead" id="lead"></p>

  <div id="qrWrap" hidden>
    <div id="qr"></div>
    <p class="hint">用手機掃描，LINE 會開啟並帶入訊息，按「傳送」即可。</p>
  </div>

  <pre id="msg"></pre>
  <button class="go" id="copy" type="button" hidden>複製訊息</button>
  <a class="go alt" id="line" target="_blank" rel="noopener">前往 LINE，通知小豬</a>
  <p class="hint" id="copyhint"></p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const LINE_ID = '@160ujzhn';
const LINE_URL = 'https://lin.ee/wM0FnDf';
const TEXT = '🐷 預約付款完成通知\n已完成預約方案付款，再麻煩小豬協助確認付款狀態，謝謝 ♡';
const $ = s => document.querySelector(s);
const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const oaLink = 'https://line.me/R/oaMessage/' + encodeURIComponent(LINE_ID).replace('%40', '@') + '/?' + encodeURIComponent(TEXT);

$('#msg').textContent = TEXT;
if (mobile) {
  $('#lead').textContent = '最後一步，接下來會自動開啟 LINE，請按「傳送」，小豬就會協助確認付款狀態囉！\n如果沒有自動跳轉，請按下面的按鈕。';
  $('#line').href = oaLink;
  $('#line').textContent = '前往 LINE，通知小豬';
  setTimeout(() => { location.href = oaLink; }, 1200);
} else {
  $('#lead').textContent = '最後一步，請用手機掃描下方 QR Code，LINE 就會自動帶入付款完成通知，按下「傳送」，小豬就會協助確認付款狀態囉！\n也可以點選「複製訊息」，到 LINE 官方帳號貼上傳送。';
  $('#line').href = LINE_URL;
  $('#line').textContent = '前往 LINE 官方帳號';
  $('#copy').hidden = false;
  if (window.QRCode) {
    new QRCode($('#qr'), {text: oaLink, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M});
    $('#qrWrap').hidden = false;
  }
}

$('#copy').onclick = async () => {
  try {
    await navigator.clipboard.writeText(TEXT);
    $('#copyhint').textContent = '已複製，請到 LINE 貼上送出。';
  } catch (e) {
    const r = document.createRange(); r.selectNodeContents($('#msg'));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    $('#copyhint').textContent = '無法自動複製，訊息已選取，請按 Ctrl + C 複製。';
  }
};
</script>
</body>
</html>
